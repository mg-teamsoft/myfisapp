<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | My Fiş App</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: #f5f7f8;
      color: #172126;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 460px);
      padding: 32px;
      border: 1px solid #dce4e8;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(23, 33, 38, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
      text-align: center;
    }

    p {
      margin: 0;
      color: #536168;
      line-height: 1.6;
      text-align: center;
    }

    form {
      display: grid;
      gap: 14px;
      margin-top: 24px;
    }

    label {
      display: grid;
      gap: 8px;
      color: #253238;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #cbd8de;
      border-radius: 8px;
      box-sizing: border-box;
      color: #172126;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #8bc5b2;
      outline-offset: 2px;
      border-color: #13795b;
    }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      background: #13795b;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .hint {
      margin-top: 6px;
      color: #536168;
      font-size: 13px;
      line-height: 1.5;
      text-align: left;
    }

    .status {
      margin-top: 18px;
      font-weight: 700;
      color: #13795b;
      text-align: center;
    }

    .status.error {
      color: #b42318;
    }
  </style>
</head>
<body>
  <main>
    <h1>Reset Password</h1>
    <p id="message">Enter a new password for your My Fiş App account.</p>

    <form id="reset-form">
      <label>
        New Password
        <input id="password" type="password" autocomplete="new-password" required />
      </label>

      <label>
        Confirm Password
        <input id="confirm-password" type="password" autocomplete="new-password" required />
      </label>

      <div class="hint">
        Password must be at least 8 characters and include uppercase, lowercase, number, and special character.
      </div>

      <button id="submit-button" type="submit">Reset Password</button>
    </form>

    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var isLocalhost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
      var apiBaseUrl = isLocalhost ? "http://localhost:3000" : "https://api.myfisapp.com";
      var token = new URLSearchParams(window.location.search).get("token");
      var form = document.getElementById("reset-form");
      var passwordInput = document.getElementById("password");
      var confirmPasswordInput = document.getElementById("confirm-password");
      var submitButton = document.getElementById("submit-button");
      var message = document.getElementById("message");
      var status = document.getElementById("status");

      function setStatus(text, isError) {
        status.textContent = text;
        status.className = isError ? "status error" : "status";
      }

      function isValidPassword(password) {
        return password.length >= 8 &&
          /[A-Z]/.test(password) &&
          /[a-z]/.test(password) &&
          /[0-9]/.test(password) &&
          /[^A-Za-z0-9]/.test(password);
      }

      if (!token) {
        message.textContent = "This reset password link is missing a token.";
        setStatus("Invalid reset link", true);
        form.hidden = true;
        return;
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        var password = passwordInput.value;
        var confirmPassword = confirmPasswordInput.value;

        if (!isValidPassword(password)) {
          setStatus("Password does not meet the requirements.", true);
          return;
        }

        if (password !== confirmPassword) {
          setStatus("Passwords do not match.", true);
          return;
        }

        submitButton.disabled = true;
        setStatus("Resetting password...", false);

        fetch(apiBaseUrl + "/api/auth/reset-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: token,
            password: password
          })
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Request failed with status " + response.status);
            }

            form.hidden = true;
            message.textContent = "Your password has been reset.";
            setStatus("Done", false);
          })
          .catch(function () {
            submitButton.disabled = false;
            setStatus("We could not reset your password. Please try again later.", true);
          });
      });
    })();
  </script>
</body>
</html>
