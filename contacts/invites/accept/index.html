<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accept Invitation | My Fiş App</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: #f5f7f8;
      color: #172126;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 460px);
      padding: 32px;
      border: 1px solid #dce4e8;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(23, 33, 38, 0.08);
      text-align: center;
    }

    .language-switcher {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .language-switcher label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #536168;
      font-size: 13px;
      font-weight: 700;
    }

    .language-switcher select {
      min-height: 34px;
      padding: 6px 28px 6px 10px;
      border: 1px solid #cbd8de;
      border-radius: 8px;
      background: #fff;
      color: #172126;
      font: inherit;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: #536168;
      line-height: 1.6;
    }

    .status {
      margin-top: 20px;
      font-weight: 700;
      color: #13795b;
    }

    .status.error {
      color: #b42318;
    }
  </style>
</head>
<body>
  <main>
    <div class="language-switcher">
      <label>
        <span id="language-label">Language</span>
        <select id="language-select" autocomplete="off">
          <option value="en">English</option>
          <option value="tr">Türkçe</option>
        </select>
      </label>
    </div>

    <h1 id="title">Accepting Invitation</h1>
    <p id="message">Please wait while we confirm your invitation.</p>
    <p id="status" class="status">Processing...</p>
  </main>

  <script>
    (function () {
      var isLocalhost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
      var apiBaseUrl = isLocalhost ? "http://localhost:3000" : "https://api.myfisapp.com";
      var action = "accept";
      var searchParams = new URLSearchParams(window.location.search);
      var token = searchParams.get("token");
      var currentLanguage = getInitialLanguage();
      var currentState = "processing";
      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var status = document.getElementById("status");
      var languageLabel = document.getElementById("language-label");
      var languageSelect = document.getElementById("language-select");

      var translations = {
        en: {
          documentTitle: "Accept Invitation | My Fiş App",
          languageLabel: "Language",
          title: "Accepting Invitation",
          processingMessage: "Please wait while we confirm your invitation.",
          processingStatus: "Processing...",
          missingTokenStatus: "Invalid invitation link",
          missingTokenMessage: "This invitation link is missing a token.",
          successMessage: "Your invitation has been accepted.",
          successStatus: "Done",
          requestFailed: "Request failed",
          genericError: "We could not accept this invitation. Please try again later.",
          requestFailedWithStatus: "Request failed with status "
        },
        tr: {
          documentTitle: "Davetiyeyi Kabul Et | My Fiş App",
          languageLabel: "Dil",
          title: "Davetiye Kabul Ediliyor",
          processingMessage: "Davetiyenizi onaylarken lütfen bekleyin.",
          processingStatus: "İşleniyor...",
          missingTokenStatus: "Geçersiz davetiye bağlantısı",
          missingTokenMessage: "Bu davetiye bağlantısında token eksik.",
          successMessage: "Davetiyeniz kabul edildi.",
          successStatus: "Tamamlandı",
          requestFailed: "İstek başarısız oldu",
          genericError: "Bu davetiyeyi kabul edemedik. Lütfen daha sonra tekrar deneyin.",
          requestFailedWithStatus: "İstek şu durum koduyla başarısız oldu: "
        }
      };

      applyLanguage(currentLanguage);

      languageSelect.addEventListener("change", function () {
        currentLanguage = languageSelect.value;
        searchParams.set("lang", currentLanguage);
        window.history.replaceState(null, "", window.location.pathname + "?" + searchParams.toString());
        applyLanguage(currentLanguage);
      });

      function setError(text, detail) {
        message.textContent = detail;
        status.textContent = text;
        status.className = "status error";
      }

      function getInitialLanguage() {
        var requestedLanguage = (searchParams.get("lang") || "").toLowerCase();

        if (requestedLanguage === "en" || requestedLanguage === "tr") {
          return requestedLanguage;
        }

        return (navigator.language || "").toLowerCase().indexOf("tr") === 0 ? "tr" : "en";
      }

      function applyLanguage(language) {
        var text = translations[language] || translations.en;

        document.documentElement.lang = language;
        document.title = text.documentTitle;
        languageLabel.textContent = text.languageLabel;
        languageSelect.value = language;
        title.textContent = text.title;

        if (currentState === "missing-token") {
          setError(text.missingTokenStatus, text.missingTokenMessage);
        } else if (currentState === "success") {
          message.textContent = text.successMessage;
          status.textContent = text.successStatus;
          status.className = "status";
        } else if (currentState === "error") {
          setError(text.requestFailed, text.genericError);
        } else {
          message.textContent = text.processingMessage;
          status.textContent = text.processingStatus;
          status.className = "status";
        }
      }

      if (!token) {
        currentState = "missing-token";
        applyLanguage(currentLanguage);
        return;
      }

      fetch(apiBaseUrl + "/api/contacts/invites/" + action + "?token=" + encodeURIComponent(token), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        }
      })
        .then(function (response) {
          if (!response.ok) {
            throw new Error(translations[currentLanguage].requestFailedWithStatus + response.status);
          }

          currentState = "success";
          applyLanguage(currentLanguage);
        })
        .catch(function () {
          currentState = "error";
          applyLanguage(currentLanguage);
        });
    })();
  </script>
</body>
</html>
