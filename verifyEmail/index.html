<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email | My Fiş App</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: #f5f7f8;
      color: #172126;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 460px);
      padding: 32px;
      border: 1px solid #dce4e8;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(23, 33, 38, 0.08);
      text-align: center;
    }

    .app-icon-link {
      display: block;
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 20px;
    }

    .app-icon {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 20px;
    }

    .language-switcher {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .language-switcher label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #536168;
      font-size: 13px;
      font-weight: 700;
    }

    .language-switcher select {
      min-height: 34px;
      padding: 6px 28px 6px 10px;
      border: 1px solid #cbd8de;
      border-radius: 8px;
      background: #fff;
      color: #172126;
      font: inherit;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: #536168;
      line-height: 1.6;
    }

    .status {
      margin-top: 20px;
      font-weight: 700;
      color: #13795b;
    }

    .status.error {
      color: #b42318;
    }

    .footer {
      margin-top: 24px;
      color: #536168;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .footer p {
      margin: 0 0 10px;
      font-size: inherit;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 18px;
    }

    .footer-links a {
      color: #13795b;
      font-weight: 700;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <div class="language-switcher">
      <label>
        <span id="language-label">Language</span>
        <select id="language-select" autocomplete="off">
          <option value="en">English</option>
          <option value="tr">Türkçe</option>
        </select>
      </label>
    </div>

    <a id="app-link" class="app-icon-link" href="https://myfisapp.com" aria-label="Open My Fis App website">
      <img class="app-icon" src="/AppIcon.png" alt="My Fis App" />
    </a>
    <h1 id="title">Verifying Email</h1>
    <p id="message">Please wait while we verify your email address.</p>
    <p id="status" class="status" aria-live="polite">Processing...</p>

    <footer class="footer">
      <p>&copy; <span id="footer-year"></span> My Fiş App, <span id="footer-rights">All rights reserved.</span></p>
      <div class="footer-links">
        <a id="support-link" href="mailto:info@guvenai.com">Contact Us for Support</a>
        <a id="privacy-link" href="https://myfisapp.com/privacy.html">Privacy Policy</a>
      </div>
    </footer>
  </main>

  <script>
    (function () {
      var isLocalhost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
      var apiBaseUrl = isLocalhost ? "http://localhost:3000" : "https://api.myfisapp.com";
      var searchParams = new URLSearchParams(window.location.search);
      var token = searchParams.get("token");
      var currentLanguage = getInitialLanguage();
      var currentState = "processing";
      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var status = document.getElementById("status");
      var languageLabel = document.getElementById("language-label");
      var languageSelect = document.getElementById("language-select");
      var appLink = document.getElementById("app-link");
      var footerYear = document.getElementById("footer-year");
      var footerRights = document.getElementById("footer-rights");
      var supportLink = document.getElementById("support-link");
      var privacyLink = document.getElementById("privacy-link");

      var translations = {
        en: {
          documentTitle: "Verify Email | My Fiş App",
          languageLabel: "Language",
          appLinkLabel: "Open My Fis App website",
          title: "Verifying Email",
          processingMessage: "Please wait while we verify your email address.",
          processingStatus: "Processing...",
          missingTokenStatus: "Invalid verification link",
          missingTokenMessage: "This email verification link is missing a token.",
          successMessage: "Your email address has been verified.",
          successStatus: "Done",
          footerRights: "All rights reserved.",
          supportLink: "Contact Us for Support",
          privacyLink: "Privacy Policy",
          requestFailed: "Request failed",
          genericError: "We could not verify your email address. Please try again later.",
          requestFailedWithStatus: "Request failed with status "
        },
        tr: {
          documentTitle: "E-posta Doğrula | My Fiş App",
          languageLabel: "Dil",
          appLinkLabel: "My Fis App web sitesini aç",
          title: "E-posta Doğrulanıyor",
          processingMessage: "E-posta adresinizi doğrularken lütfen bekleyin.",
          processingStatus: "İşleniyor...",
          missingTokenStatus: "Geçersiz doğrulama bağlantısı",
          missingTokenMessage: "Bu e-posta doğrulama bağlantısında token eksik.",
          successMessage: "E-posta adresiniz doğrulandı.",
          successStatus: "Tamamlandı",
          footerRights: "Tüm hakları saklıdır.",
          supportLink: "Destek İçin Bize Ulaşın",
          privacyLink: "Gizlilik Politikası",
          requestFailed: "İstek başarısız oldu",
          genericError: "E-posta adresinizi doğrulayamadık. Lütfen daha sonra tekrar deneyin.",
          requestFailedWithStatus: "İstek şu durum koduyla başarısız oldu: "
        }
      };

      footerYear.textContent = new Date().getFullYear();
      applyLanguage(currentLanguage);

      languageSelect.addEventListener("change", function () {
        currentLanguage = languageSelect.value;
        searchParams.set("lang", currentLanguage);
        window.history.replaceState(null, "", window.location.pathname + "?" + searchParams.toString());
        applyLanguage(currentLanguage);
      });

      function setError(text, detail) {
        message.textContent = detail;
        status.textContent = text;
        status.className = "status error";
      }

      function getInitialLanguage() {
        var requestedLanguage = (searchParams.get("lang") || "").toLowerCase();

        if (requestedLanguage === "en" || requestedLanguage === "tr") {
          return requestedLanguage;
        }

        return (navigator.language || "").toLowerCase().indexOf("tr") === 0 ? "tr" : "en";
      }

      function applyLanguage(language) {
        var text = translations[language] || translations.en;

        document.documentElement.lang = language;
        document.title = text.documentTitle;
        languageLabel.textContent = text.languageLabel;
        languageSelect.value = language;
        appLink.setAttribute("aria-label", text.appLinkLabel);
        title.textContent = text.title;
        footerRights.textContent = text.footerRights;
        supportLink.textContent = text.supportLink;
        privacyLink.textContent = text.privacyLink;

        if (currentState === "missing-token") {
          setError(text.missingTokenStatus, text.missingTokenMessage);
        } else if (currentState === "success") {
          message.textContent = text.successMessage;
          status.textContent = text.successStatus;
          status.className = "status";
        } else if (currentState === "error") {
          setError(text.requestFailed, text.genericError);
        } else {
          message.textContent = text.processingMessage;
          status.textContent = text.processingStatus;
          status.className = "status";
        }
      }

      if (!token) {
        currentState = "missing-token";
        applyLanguage(currentLanguage);
        return;
      }

      fetch(apiBaseUrl + "/api/auth/verify-email?token=" + encodeURIComponent(token), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        }
      })
        .then(function (response) {
          if (!response.ok) {
            throw new Error(translations[currentLanguage].requestFailedWithStatus + response.status);
          }

          currentState = "success";
          applyLanguage(currentLanguage);
        })
        .catch(function () {
          currentState = "error";
          applyLanguage(currentLanguage);
        });
    })();
  </script>
</body>
</html>
